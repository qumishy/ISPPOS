name: Android Development Client APK

on:
  workflow_dispatch:
  push:
    branches:
      - chore/codespaces-preview

jobs:
  build-dev-client:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout chore/codespaces-preview
        uses: actions/checkout@v4
        with:
          ref: chore/codespaces-preview

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm install
          npx expo install --check

      - name: Setup EAS CLI
        run: npm install --global eas-cli

      - name: Build Android Development Client
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: https://ybpzjvswutvdbjevgawt.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          eas build \
            --platform android \
            --profile development \
            --non-interactive \
            --wait
