name: Repair Collections UI

on:
  push:
    branches:
      - chore/codespaces-preview
    paths:
      - .github/workflows/repair-collections-ui.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: chore/codespaces-preview

      - name: Restore and align Collections UI
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('src/screens/CollectionsListScreen.js')
          text = path.read_text()

          # Match InvoicesListScreen card interaction: card itself is not the expand trigger.
          open_pattern = re.compile(
              r"(?P<indent>\s*)<TouchableOpacity\s*\n\s*style=\{s\.colCard\}\s*\n\s*activeOpacity=\{0\.85\}\s*\n\s*onPress=\{\(\) => setExpandedColId\(expanded \? null : col\.id\)\}\s*\n\s*onLongPress=\{\(\) => \{",
              re.M,
          )
          if not open_pattern.search(text):
              raise SystemExit('Expected collection card opening was not found')
          text = open_pattern.sub(
              "\n            <TouchableOpacity\n              style={[s.invCard, { flexDirection: 'column', alignItems: 'stretch' }]}\n              activeOpacity={0.85}\n              onLongPress={() => {",
              text,
              count=1,
          )

          # Replace only the first card header block, stopping immediately before the admin approver line.
          header_pattern = re.compile(
              r"\n\s*<View style=\{\{ flexDirection: 'row-reverse', alignItems: 'flex-start', justifyContent: 'space-between', gap: 10 \}\}>.*?\n\s*</View>\n\n\s*\{isAdminUser && isApprovedCollectionRow\(col\)",
              re.S,
          )
          header_replacement = """
              <View style={{ flexDirection: 'row-reverse', alignItems: 'flex-start', justifyContent: 'space-between', gap: 10 }}>
                <View style={{ flex: 1, gap: 6 }}>
                  <Text style={[s.invPos, { fontSize: fontSize.lg, lineHeight: fontSize.lg + 2 }]} numberOfLines={1}>
                    {col.pos_name || '—'}
                  </Text>
                  <View style={{ flexDirection: 'row-reverse', alignItems: 'center', gap: 8 }}>
                    <Text style={[s.colNum, { marginBottom: 0, fontSize: 11, color: colors.t3 }]}>
                      {col.collection_number || col.invoice_number || '—'}
                    </Text>
                    {Number(col.synced) === 0 && <Text style={{ fontSize: 10, color: colors.orange, fontWeight: '900' }}>●</Text>}
                  </View>
                </View>
                <View style={{ alignItems: 'flex-end', gap: 6 }}>
                  <Text style={[s.colAmt, { fontSize: fontSize.xxl || (fontSize.xl + 4), color: colors.primary, fontWeight: '900' }]}>
                    {formatCurrency(collectionAmount)}
                  </Text>
                  <Text style={{ fontSize: 10, color: colors.t3, fontWeight: '700' }}>
                    {formatDateShort(col.collection_date || col.created_at)}
                  </Text>
                </View>
              </View>

              {isAdminUser && isApprovedCollectionRow(col)"""
          text, header_count = header_pattern.subn(header_replacement, text, count=1)
          if header_count != 1:
              raise SystemExit(f'Expected one collection header replacement, got {header_count}')

          marker = """              {/* ── EXPANDED: Secondary details + actions ── */}
              {expanded && ("""
          expand_control = """              <TouchableOpacity
                style={{
                  marginTop: 8,
                  flexDirection: 'row-reverse',
                  alignItems: 'center',
                  justifyContent: 'space-between',
                  backgroundColor: colors.bg2,
                  borderWidth: 1,
                  borderColor: colors.border + '80',
                  borderRadius: radius.md,
                  paddingHorizontal: spacing.sm,
                  paddingVertical: 8,
                }}
                onPress={() => setExpandedColId(expanded ? null : col.id)}
                activeOpacity={0.85}
              >
                <View style={{ flexDirection: 'row-reverse', alignItems: 'center', gap: 8 }}>
                  <Feather name={expanded ? 'chevron-up' : 'chevron-down'} size={16} color={colors.primary} />
                  <Text style={{ fontSize: 12, color: colors.primary, fontWeight: '800' }}>
                    {expanded ? 'إخفاء التفاصيل' : 'عرض مزيد من التفاصيل'}
                  </Text>
                </View>
                <Text style={{ fontSize: 10, color: colors.t3, fontWeight: '700' }}>
                  تفاصيل التحصيل والإجراءات
                </Text>
              </TouchableOpacity>

              {/* ── EXPANDED: Secondary details + actions ── */}
              {expanded && ("""
          if marker not in text:
              raise SystemExit('Expanded details marker was not found')
          text = text.replace(marker, expand_control, 1)
          text = text.replace("borderTopColor: colors.border + '30'", "borderTopColor: colors.border + '70'", 1)

          required = [
              'تم الاعتماد بواسطة: {col.approver_name}',
              'مبلغ التحصيل', 'مرتجع الكروت', 'الإجمالي المغطي', 'حالة سداد الفاتورة',
              'المزامنة', 'ملاحظات', 'طباعة', 'واتساب', 'الرسائل',
              'handlePrint', 'handleWhatsApp', 'handleSMS',
              'approveLocalCollection', 'cancelLocalCollectionApproval',
              "عرض مزيد من التفاصيل",
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Required collection UI/behavior was lost: {missing}')

          path.write_text(text)
          PY

      - name: Show focused diff
        run: |
          git diff --check
          git diff --stat
          git diff -- src/screens/CollectionsListScreen.js

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate Expo JavaScript bundle
        env:
          CI: true
          EXPO_PUBLIC_SUPABASE_URL: https://ybpzjvswutvdbjevgawt.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx expo export --platform android --output-dir /tmp/isppos-export

      - name: Commit repaired Collections screen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/CollectionsListScreen.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore and align collections screen UI"
          git push origin HEAD:chore/codespaces-preview
