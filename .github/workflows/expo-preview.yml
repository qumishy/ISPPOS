name: Expo Cloud Preview

on:
  workflow_dispatch:
  push:
    branches:
      - chore/codespaces-preview

jobs:
  expo-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout chore/codespaces-preview
        uses: actions/checkout@v4
        with:
          ref: chore/codespaces-preview

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Expo Tunnel
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ybpzjvswutvdbjevgawt.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_NO_TELEMETRY: "1"
          CI: "1"
        run: |
          echo "Starting Expo Tunnel in foreground."
          echo "Expo/Metro tunnel output, including the tunnel URL and QR information when emitted by Expo, will remain visible in this step's logs."
          npm run preview
