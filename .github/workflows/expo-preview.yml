name: Expo Cloud Preview

on:
  workflow_dispatch:
  push:
    branches:
      - chore/codespaces-preview

jobs:
  expo-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout chore/codespaces-preview
        uses: actions/checkout@v4
        with:
          ref: chore/codespaces-preview

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Expo Development Client Tunnel
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ybpzjvswutvdbjevgawt.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_NO_TELEMETRY: "1"
          CI: "1"
        shell: bash
        run: |
          set -u

          npx expo start --dev-client --tunnel > expo-preview.log 2>&1 &
          echo $! > expo-preview.pid
          EXPO_PID="$(cat expo-preview.pid)"

          echo "Expo PID: ${EXPO_PID}"
          echo "Waiting up to 120 seconds for 'Tunnel ready.'..."

          READY=0
          for attempt in $(seq 1 60); do
            if grep -q "Tunnel ready\." expo-preview.log; then
              READY=1
              break
            fi
            if ! kill -0 "$EXPO_PID" 2>/dev/null; then
              echo "Expo exited before the tunnel became ready."
              tail -n 100 expo-preview.log || true
              exit 1
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "Timed out waiting for 'Tunnel ready.'."
            tail -n 100 expo-preview.log || true
            exit 1
          fi

          echo "Tunnel ready detected."
          mkdir -p diagnostics
          cp expo-preview.log diagnostics/ || true

          cat > diagnostics/run-diagnostics.sh <<'DIAG'
          #!/usr/bin/env bash
          set -u

          curl_safe() {
            local outfile="$1"
            shift
            set +e
            curl -i --connect-timeout 5 --max-time 10 "$@" > "$outfile" 2>&1
            local rc=$?
            echo "CURL_EXIT_CODE=$rc" >> "$outfile"
            set -e
          }

          for attempt in $(seq 1 6); do
            if curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \
              http://127.0.0.1:4040/api/tunnels -o ngrok-tunnels.json; then
              break
            fi
            sleep 2
          done

          if [ -s ngrok-tunnels.json ]; then
            cp ngrok-tunnels.json diagnostics/
          fi

          PUBLIC_URL=""
          if [ -s ngrok-tunnels.json ]; then
            PUBLIC_URL="$(node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('ngrok-tunnels.json', 'utf8'));
          const tunnels = Array.isArray(data.tunnels) ? data.tunnels : [];
          const preferred = tunnels.find((t) => String(t?.config?.addr || '').includes('8081'))
            || tunnels.find((t) => typeof t.public_url === 'string' && t.public_url.startsWith('https://'));
          if (preferred?.public_url) process.stdout.write(preferred.public_url);
          NODE
            )"
          fi

          echo "PUBLIC_URL=$PUBLIC_URL"

          curl_safe diagnostics/localhost-default.txt http://127.0.0.1:8081
          curl_safe diagnostics/localhost-expo-json.txt \
            -H "Accept: application/expo+json,application/json" \
            http://127.0.0.1:8081

          if [ -n "$PUBLIC_URL" ]; then
            curl_safe diagnostics/tunnel-default.txt "$PUBLIC_URL"
            curl_safe diagnostics/tunnel-expo-json.txt \
              -H "Accept: application/expo+json,application/json" \
              "$PUBLIC_URL"
          else
            echo "PUBLIC_URL_NOT_FOUND" > diagnostics/tunnel-default.txt
            echo "PUBLIC_URL_NOT_FOUND" > diagnostics/tunnel-expo-json.txt
          fi

          echo "=== LOCALHOST DEFAULT ==="
          cat diagnostics/localhost-default.txt || true
          echo "=== LOCALHOST EXPO JSON ==="
          cat diagnostics/localhost-expo-json.txt || true
          echo "=== TUNNEL DEFAULT ==="
          cat diagnostics/tunnel-default.txt || true
          echo "=== TUNNEL EXPO JSON ==="
          cat diagnostics/tunnel-expo-json.txt || true

          : > diagnostics/metadata-matches.txt
          scan_path() {
            local p="$1"
            if compgen -G "$p" > /dev/null; then
              timeout 10s grep -RniE --binary-files=without-match \
                'exp://|exps://|hostUri|debuggerHost|manifest|exp\.direct|expo-development-client' \
                $p 2>/dev/null \
                | grep -v -E 'EXPO_PUBLIC_SUPABASE|SUPABASE_ANON_KEY|eyJ[A-Za-z0-9_-]+' \
                | head -n 200 >> diagnostics/metadata-matches.txt || true
            fi
          }

          scan_path ".expo"
          scan_path "$HOME/.expo"
          scan_path "$HOME/.cache"
          scan_path "/tmp/metro*"
          scan_path "/tmp/expo*"
          scan_path "/tmp/ngrok*"

          ACTUAL_URL="$(timeout 10s grep -RhoE --binary-files=without-match '[A-Za-z0-9._-]+://expo-development-client/[^[:space:]\"'"'"'<>]*|exp(s)?://[^[:space:]\"'"'"'<>]+' diagnostics .expo "$HOME/.expo" 2>/dev/null | head -n 1 || true)"

          if [ -n "$ACTUAL_URL" ]; then
            printf '%s\n' "$ACTUAL_URL" > diagnostics/expo-preview-url.txt
            echo "EXPO_PREVIEW_URL=$ACTUAL_URL"
          else
            echo "EXPO_PREVIEW_URL_NOT_DETERMINED"
          fi
          DIAG

          chmod +x diagnostics/run-diagnostics.sh

          set +e
          timeout --signal=TERM --kill-after=10s 180s bash diagnostics/run-diagnostics.sh
          DIAG_RC=$?
          set -e

          cp expo-preview.log diagnostics/ || true
          [ -f ngrok-tunnels.json ] && cp ngrok-tunnels.json diagnostics/ || true

          if [ "$DIAG_RC" -eq 124 ] || [ "$DIAG_RC" -eq 137 ]; then
            echo "Diagnostics reached the 3-minute limit; continuing to artifact upload."
          elif [ "$DIAG_RC" -ne 0 ]; then
            echo "Diagnostics exited with code $DIAG_RC; continuing to artifact upload."
          fi

      - name: Upload Expo preview diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expo-preview-diagnostics
          path: |
            diagnostics/
            expo-preview.log
            ngrok-tunnels.json
          if-no-files-found: warn

      - name: Keep Expo Development Client Tunnel alive
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          EXPO_PID="$(cat expo-preview.pid)"
          echo "Keeping Expo Development Client Tunnel alive with PID ${EXPO_PID}."
          while true; do
            if ! kill -0 "$EXPO_PID" 2>/dev/null; then
              echo "Expo process exited unexpectedly."
              tail -n 100 expo-preview.log || true
              exit 1
            fi
            sleep 15
          done
