name: Expo Cloud Preview

on:
  workflow_dispatch:
  push:
    branches:
      - chore/codespaces-preview

jobs:
  expo-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout chore/codespaces-preview
        uses: actions/checkout@v4
        with:
          ref: chore/codespaces-preview

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Expo Tunnel and diagnose preview URL
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ybpzjvswutvdbjevgawt.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_NO_TELEMETRY: "1"
          CI: "1"
        shell: bash
        run: |
          set -euo pipefail

          npm run preview > expo-preview.log 2>&1 &
          echo $! > expo-preview.pid
          EXPO_PID="$(cat expo-preview.pid)"

          echo "Expo PID: ${EXPO_PID}"
          echo "Waiting up to 120 seconds for 'Tunnel ready.'..."

          READY=0
          for attempt in $(seq 1 60); do
            if grep -q "Tunnel ready\." expo-preview.log; then
              READY=1
              break
            fi
            if ! kill -0 "$EXPO_PID" 2>/dev/null; then
              echo "Expo exited before the tunnel became ready."
              tail -n 100 expo-preview.log || true
              exit 1
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "Timed out waiting for 'Tunnel ready.'."
            tail -n 100 expo-preview.log || true
            exit 1
          fi

          echo "Tunnel ready detected."

          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 5 \
              http://127.0.0.1:4040/api/tunnels \
              -o ngrok-tunnels.json; then
              break
            fi
            sleep 2
          done

          if [ ! -s ngrok-tunnels.json ]; then
            echo "Could not read ngrok local API."
            exit 1
          fi

          PUBLIC_URL="$(node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('ngrok-tunnels.json', 'utf8'));
          const tunnels = Array.isArray(data.tunnels) ? data.tunnels : [];
          const preferred = tunnels.find((t) => {
            const addr = String(t?.config?.addr || '');
            return addr.includes('8081');
          }) || tunnels.find((t) => typeof t.public_url === 'string' && t.public_url.startsWith('https://'));
          if (preferred?.public_url) process.stdout.write(preferred.public_url);
          NODE
          )"

          if [ -z "$PUBLIC_URL" ]; then
            echo "No HTTPS ngrok public_url found."
            cat ngrok-tunnels.json
            exit 1
          fi

          echo "PUBLIC_URL=$PUBLIC_URL"

          mkdir -p diagnostics
          cp expo-preview.log diagnostics/
          cp ngrok-tunnels.json diagnostics/

          curl_capture() {
            local name="$1"
            shift
            set +e
            curl -sS -D "diagnostics/${name}.headers.txt" -o "diagnostics/${name}.body.txt" "$@"
            local code=$?
            echo "$code" > "diagnostics/${name}.curl-exit.txt"
            set -e
          }

          curl_capture localhost-root http://127.0.0.1:8081
          curl_capture localhost-expo-json -H "Accept: application/expo+json,application/json" http://127.0.0.1:8081
          curl_capture tunnel-root "$PUBLIC_URL"
          curl_capture tunnel-expo-json -H "Accept: application/expo+json,application/json" "$PUBLIC_URL"

          for endpoint in "/manifest" "/index.exp" "/?platform=android" "/?platform=android&dev=true&minify=false"; do
            safe="$(printf '%s' "$endpoint" | tr '/?&=' '_____')"
            curl_capture "localhost${safe}" -H "Accept: application/expo+json,application/json" "http://127.0.0.1:8081${endpoint}"
            curl_capture "tunnel${safe}" -H "Accept: application/expo+json,application/json" "${PUBLIC_URL}${endpoint}"
          done

          {
            echo "=== process tree ==="
            ps -eo pid,ppid,args --forest | grep -E "expo|ngrok|metro|node" | grep -v grep || true
            echo
            echo "=== listening ports ==="
            ss -lntp || netstat -lntp || true
            echo
            echo "=== Expo process command ==="
            ps -p "$EXPO_PID" -o pid=,ppid=,args= || true
          } > diagnostics/processes-and-ports.txt

          {
            echo "=== metadata matches ==="
            grep -RniE --binary-files=without-match \
              'exp://|exps://|hostUri|debuggerHost|packagerOpts|manifest|exp\.direct' \
              .expo "$HOME/.expo" /tmp 2>/dev/null \
              | grep -v -E 'EXPO_PUBLIC_SUPABASE|SUPABASE_ANON_KEY|eyJ[A-Za-z0-9_-]+' \
              | head -n 500 || true
          } > diagnostics/metadata-matches.txt

          ACTUAL_URL="$(
            grep -RhoE --binary-files=without-match '(exp|exps)://[^[:space:]\"'"'"'<>]+' \
              diagnostics .expo "$HOME/.expo" /tmp 2>/dev/null \
              | head -n 1 || true
          )"

          if [ -n "$ACTUAL_URL" ]; then
            printf '%s\n' "$ACTUAL_URL" > diagnostics/expo-preview-url.txt
            echo "EXPO_PREVIEW_URL=$ACTUAL_URL"
            {
              echo "## Expo Cloud Preview diagnostics"
              echo
              echo "**EXPO_PREVIEW_URL:** \`$ACTUAL_URL\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "EXPO_PREVIEW_URL_NOT_DETERMINED"
            {
              echo "## Expo Cloud Preview diagnostics"
              echo
              echo "EXPO_PREVIEW_URL_NOT_DETERMINED"
              echo
              echo "Tunnel public URL observed: \`$PUBLIC_URL\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "---- localhost:8081 headers ----"
          cat diagnostics/localhost-root.headers.txt || true
          echo "---- localhost:8081 body ----"
          cat diagnostics/localhost-root.body.txt || true
          echo "---- tunnel headers ----"
          cat diagnostics/tunnel-root.headers.txt || true
          echo "---- tunnel body ----"
          cat diagnostics/tunnel-root.body.txt || true
          echo "---- metadata matches ----"
          cat diagnostics/metadata-matches.txt || true

      - name: Upload Expo preview diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: expo-preview-diagnostics
          path: diagnostics/
          if-no-files-found: error

      - name: Keep Expo Tunnel alive
        shell: bash
        run: |
          set -euo pipefail
          EXPO_PID="$(cat expo-preview.pid)"
          echo "Keeping Expo Tunnel alive with PID ${EXPO_PID}."
          while true; do
            if ! kill -0 "$EXPO_PID" 2>/dev/null; then
              echo "Expo process exited unexpectedly."
              tail -n 100 expo-preview.log || true
              exit 1
            fi
            sleep 15
          done
