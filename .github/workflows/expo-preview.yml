name: Expo Cloud Preview

on:
  workflow_dispatch:
  push:
    branches:
      - chore/codespaces-preview

jobs:
  expo-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout chore/codespaces-preview
        uses: actions/checkout@v4
        with:
          ref: chore/codespaces-preview

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm install
          npx expo install --check

      - name: Start Expo Development Client Tunnel
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ybpzjvswutvdbjevgawt.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_NO_TELEMETRY: "1"
          CI: "1"
        shell: bash
        run: |
          set -euo pipefail

          npx expo start --dev-client --tunnel > expo-preview.log 2>&1 &
          echo $! > expo-preview.pid
          EXPO_PID="$(cat expo-preview.pid)"

          echo "Expo PID: ${EXPO_PID}"
          echo "Waiting up to 120 seconds for Tunnel ready..."

          READY=0
          for attempt in $(seq 1 60); do
            if grep -q "Tunnel ready\." expo-preview.log; then
              READY=1
              break
            fi
            if ! kill -0 "$EXPO_PID" 2>/dev/null; then
              echo "Expo exited before the tunnel became ready."
              tail -n 100 expo-preview.log || true
              exit 1
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "Timed out waiting for Tunnel ready."
            tail -n 100 expo-preview.log || true
            exit 1
          fi

          mkdir -p diagnostics
          cp expo-preview.log diagnostics/expo-preview.log

          # Ask Expo CLI itself for the URL that Android Development Client must open.
          # This avoids treating the raw ngrok https://...exp.direct transport URL as
          # the app launch URL.
          DEV_CLIENT_JSON=""
          for attempt in $(seq 1 12); do
            DEV_CLIENT_JSON="$(curl --fail --silent --show-error --connect-timeout 3 --max-time 5 \
              'http://127.0.0.1:8081/_expo/open?platform=android&runtime=custom' 2>/dev/null || true)"
            if [ -n "$DEV_CLIENT_JSON" ]; then
              break
            fi
            sleep 2
          done

          printf '%s\n' "$DEV_CLIENT_JSON" > diagnostics/expo-open-android.json

          DEV_CLIENT_URL="$(DEV_CLIENT_JSON="$DEV_CLIENT_JSON" node - <<'NODE'
          const raw = process.env.DEV_CLIENT_JSON || '';
          let value = '';
          try {
            const parsed = JSON.parse(raw);
            if (typeof parsed === 'string') value = parsed;
            else value = parsed.url || parsed.href || parsed.launchUrl || parsed.launchURL || '';
          } catch (_) {
            const match = raw.match(/[a-z][a-z0-9+.-]*:\/\/expo-development-client\/\?url=[^\s"'<>]+/i);
            value = match ? match[0] : '';
          }
          if (value) process.stdout.write(value);
          NODE
          )"

          # Backward-compatible fallback for older Expo CLI versions: derive only
          # the generated dev-client wrapper, while keeping the manifest transport
          # URL from Expo's own manifest response.
          if [ -z "$DEV_CLIENT_URL" ]; then
            MANIFEST_JSON="$(curl --fail --silent --show-error --connect-timeout 3 --max-time 5 \
              -H 'Accept: application/expo+json,application/json' \
              http://127.0.0.1:8081 2>/dev/null || true)"
            printf '%s\n' "$MANIFEST_JSON" > diagnostics/localhost-manifest.json
            DEV_CLIENT_URL="$(MANIFEST_JSON="$MANIFEST_JSON" node - <<'NODE'
          const raw = process.env.MANIFEST_JSON || '';
          try {
            const m = JSON.parse(raw);
            const host = m?.extra?.expoClient?.hostUri || m?.extra?.expoGo?.debuggerHost || '';
            const slug = m?.extra?.expoClient?.slug || 'isp-cards-system';
            if (!host) process.exit(0);
            const manifestUrl = `https://${host}`;
            process.stdout.write(`exp+${slug}://expo-development-client/?url=${encodeURIComponent(manifestUrl)}`);
          } catch (_) {}
          NODE
            )"
          fi

          if [ -z "$DEV_CLIENT_URL" ]; then
            echo "Could not determine the Development Client launch URL."
            cat diagnostics/expo-open-android.json || true
            tail -n 100 expo-preview.log || true
            exit 1
          fi

          printf '%s\n' "$DEV_CLIENT_URL" > diagnostics/expo-preview-url.txt
          echo "============================================================"
          echo "ANDROID DEVELOPMENT CLIENT URL"
          echo "$DEV_CLIENT_URL"
          echo "============================================================"
          echo "Open this URL with the installed ISPPOS Development Client."

          # Confirm the tunnel manifest itself is reachable before keeping the job alive.
          MANIFEST_URL="$(DEV_CLIENT_URL="$DEV_CLIENT_URL" node - <<'NODE'
          const u = process.env.DEV_CLIENT_URL || '';
          try {
            const outer = new URL(u);
            process.stdout.write(outer.searchParams.get('url') || '');
          } catch (_) {}
          NODE
          )"
          if [ -n "$MANIFEST_URL" ]; then
            curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \
              -H 'Accept: application/expo+json,application/json' \
              "$MANIFEST_URL" > diagnostics/tunnel-manifest.json
          fi

      - name: Upload Expo preview diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expo-preview-diagnostics
          path: |
            diagnostics/
            expo-preview.log
          if-no-files-found: warn

      - name: Keep Expo Development Client Tunnel alive
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          EXPO_PID="$(cat expo-preview.pid)"
          echo "Keeping Expo Development Client Tunnel alive with PID ${EXPO_PID}."
          echo "The tunnel remains available while this workflow job is running (maximum 30 minutes)."
          while true; do
            if ! kill -0 "$EXPO_PID" 2>/dev/null; then
              echo "Expo process exited unexpectedly."
              tail -n 100 expo-preview.log || true
              exit 1
            fi
            sleep 15
          done
